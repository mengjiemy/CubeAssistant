name: Simulator Preview Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / available runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Flatten Swift sources to match Xcode project group paths
        run: |
          for d in Engine Models Views; do
            if [ -d "CubeAssistant/$d" ]; then cp CubeAssistant/$d/*.swift CubeAssistant/ 2>/dev/null || true; fi
          done
          echo "swift files in CubeAssistant/: $(ls CubeAssistant/*.swift | wc -l)"

      - name: Build for iOS Simulator (no code signing)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project CubeAssistant.xcodeproj \
            -target CubeAssistant \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee sim.log

      - name: Report build error to issue
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(grep -iE "error:|error generated|fatal error|BUILD FAILED|cannot be found|no such module|no such file" sim.log | sed 's/\x1b\[[0-9;]*m//g' | head -60)
          [ -z "$RAW" ] && RAW=$(tail -80 sim.log | sed 's/\x1b\[[0-9;]*m//g')
          gh issue create --title "Preview build failed $(date +%s)" --body "$(printf '```\n%s\n```', "$RAW")"

      - name: Boot simulator, install app, capture screenshots
        if: steps.build.outcome == 'success'
        run: |
          set -e
          APP=$(find "$PWD/build" -name "CubeAssistant.app" -maxdepth 4 -type d | head -1)
          echo "APP=$APP"; [ -z "$APP" ] && exit 1
          RUNTIME=$(xcrun simctl list runtimes -j | /usr/bin/python3 -c "import sys,json;r=json.load(sys.stdin)['runtimes'];ios=[x for x in r if 'iOS' in x['name']];print(ios[-1]['identifier'])")
          echo "RUNTIME=$RUNTIME"
          UDID=$(xcrun simctl create CubePrev "iPhone 17 Pro" "$RUNTIME")
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID"
          # 等 springboard 完全就绪、dismiss 引导通知
          sleep 10
          # 截图前确认 app 安装
          xcrun simctl install "$UDID" "$APP"
          # 把 app 拉回前台并 dismiss 通知（轻点 status bar 等不可靠，改用 keychain）
          xcrun simctl ui "$UDID" appearance dark 2>/dev/null || true
          # 真正启动一次（让 LaunchServices 注册 bundle）
          xcrun simctl launch "$UDID" com.jiege.CubeAssistant >/dev/null 2>&1 || true
          sleep 3
          xcrun simctl terminate "$UDID" com.jiege.CubeAssistant 2>/dev/null || true
          sleep 1
          mkdir -p /tmp/shots
          for mode in home scramble solve scan history; do
            xcrun simctl terminate "$UDID" com.jiege.CubeAssistant 2>/dev/null || true
            sleep 1
            echo "--- launching mode=$mode ---"
            xcrun simctl launch "$UDID" com.jiege.CubeAssistant --preview "$mode"
            sleep 7
            xcrun simctl io "$UDID" screenshot "/tmp/shots/prev_${mode}.png"
            sz=$(wc -c < "/tmp/shots/prev_${mode}.png")
            echo "shot $mode -> $sz bytes"
          done
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CubeAssistant-preview
          path: /tmp/shots/*.png
          retention-days: 7
