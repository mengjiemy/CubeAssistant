name: Simulator Preview Screenshots

# 触发：打 preview-* tag 推送即跑，或手动 workflow_dispatch
on:
  push:
    tags:
      - 'preview-*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  preview:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Flatten Swift sources to match project group paths
        run: |
          for d in Engine Models Views; do
            if [ -d "CubeAssistant/$d" ]; then cp CubeAssistant/$d/*.swift CubeAssistant/ 2>/dev/null || true; fi
          done
          echo "swift in CubeAssistant/: $(ls CubeAssistant/*.swift | wc -l)"

      - name: Build for iOS Simulator (no code signing)
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project CubeAssistant.xcodeproj \
            -target CubeAssistant \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee sim.log

      - name: Verify app bundle (executable + icon assets)
        id: verify
        run: |
          APP=$(find "$PWD/build" -name "CubeAssistant.app" -maxdepth 4 -type d | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "NO_APP_BUNDLE"; exit 1; fi
          EXE="$APP/CubeAssistant"
          if [ ! -x "$EXE" ]; then echo "NO_EXECUTABLE"; exit 1; fi
          echo "exe type: $(file "$EXE")"
          if [ -f "$APP/Assets.car" ]; then echo "Assets.car present"; else echo "WARN no Assets.car"; fi
          echo "APP_OK"

      # 全程诊断写 _diag.txt，本 step 结尾强制 exit 0（永不 fail）
      - name: Boot simulator + install + screenshots
        if: steps.verify.outcome == 'success'
        run: |
          set +e
          APP=$(find "$PWD/build" -name "CubeAssistant.app" -maxdepth 4 -type d | head -1)
          DIAG=/tmp/shots/_diag.txt
          mkdir -p /tmp/shots
          {
            echo "=== APP ==="; echo "$APP"
            echo "=== runtimes ==="; xcrun simctl list runtimes
            echo "=== iPhone devicetypes ==="; xcrun simctl list devicetypes | grep -i iphone
          } > "$DIAG" 2>&1
          RUNTIME=$(xcrun simctl list runtimes -j 2>/dev/null | /usr/bin/python3 -c "import sys,json;r=json.load(sys.stdin)['runtimes'];ios=[x for x in r if 'iOS' in x.get('name','')];print(ios[-1]['identifier'] if ios else '')")
          DEVTYPE=$(xcrun simctl list devicetypes 2>/dev/null | grep -iE '^iPhone' | grep -viE 'Air|Retina|SE' | head -1 | sed 's/ (.*//')
          echo "RUNTIME=[$RUNTIME]" >> "$DIAG"
          echo "DEVTYPE=[$DEVTYPE]" >> "$DIAG"
          if [ -z "$RUNTIME" ] || [ -z "$DEVTYPE" ]; then
            echo "FATAL: no runtime or devicetype" >> "$DIAG"
            exit 0
          fi
          UDID=$(xcrun simctl create CubePrev "$DEVTYPE" "$RUNTIME" 2>&1)
          echo "create=[$UDID]" >> "$DIAG"
          xcrun simctl boot "$UDID" >> "$DIAG" 2>&1
          echo "boot rc=$?" >> "$DIAG"
          xcrun simctl bootstatus "$UDID" -b >> "$DIAG" 2>&1
          echo "bootstatus rc=$?" >> "$DIAG"
          sleep 3
          xcrun simctl install "$UDID" "$APP" >> "$DIAG" 2>&1
          echo "install rc=$?" >> "$DIAG"
          xcrun simctl listapps "$UDID" 2>/dev/null | grep -c "com.jiege.CubeAssistant" | sed 's/^/installed_count=/' >> "$DIAG"
          for mode in home scramble solve scan history; do
            xcrun simctl terminate "$UDID" com.jiege.CubeAssistant 2>/dev/null || true
            sleep 1
            if [ "$mode" = "home" ]; then
              xcrun simctl launch "$UDID" com.jiege.CubeAssistant >> "$DIAG" 2>&1
            else
              xcrun simctl launch "$UDID" com.jiege.CubeAssistant --preview "$mode" >> "$DIAG" 2>&1
            fi
            echo "launch rc=$? mode=$mode" >> "$DIAG"
            sleep 8
            echo "--- mode=$mode procs ---" >> "$DIAG"
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -i cube >> "$DIAG" || echo "(no cube process)" >> "$DIAG"
            xcrun simctl io "$UDID" screenshot "/tmp/shots/prev_${mode}.png" >> "$DIAG" 2>&1
            echo "shot $mode -> $(wc -c < /tmp/shots/prev_${mode}.png 2>/dev/null) bytes" >> "$DIAG"
          done
          xcrun simctl shutdown "$UDID" 2>/dev/null
          xcrun simctl delete "$UDID" 2>/dev/null
          exit 0

      # 用 issue 回显诊断（唯一确认可读的通道），同时尝试把图推 preview 分支
      - name: Report diagnostics via issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== _diag.txt 内容 ==="
          cat /tmp/shots/_diag.txt 2>/dev/null || echo "(no diag)"
          echo "=== 回显到 issue ==="
          cat /tmp/shots/_diag.txt 2>/dev/null | gh issue create --title "Preview diag $(date +%s)" --body-file - 2>&1 | tail -3
          echo "=== 尝试把图推 preview 分支 ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p preview
          cp /tmp/shots/*.png preview/ 2>/dev/null || true
          cp /tmp/shots/_diag.txt preview/ 2>/dev/null || true
          git add preview/ || true
          git commit -m "chore: simulator previews [skip ci]" --allow-empty || echo "no changes"
          git push origin HEAD:preview --force 2>&1 | tail -3 || echo "push preview failed"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CubeAssistant-preview
          path: /tmp/shots/*.png
          retention-days: 7