name: Simulator Preview Screenshots

# 触发：打 preview-* tag 推送即跑（SSH push 即可，无需 token 调 API）
on:
  push:
    tags:
      - 'preview-*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  preview:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Flatten Swift sources to match project group paths
        run: |
          for d in Engine Models Views; do
            if [ -d "CubeAssistant/$d" ]; then cp CubeAssistant/$d/*.swift CubeAssistant/ 2>/dev/null || true; fi
          done
          echo "swift in CubeAssistant/: $(ls CubeAssistant/*.swift | wc -l)"

      - name: Build for iOS Simulator (no code signing)
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project CubeAssistant.xcodeproj \
            -target CubeAssistant \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee sim.log

      - name: Verify app bundle (executable + icon assets)
        id: verify
        run: |
          APP=$(find "$PWD/build" -name "CubeAssistant.app" -maxdepth 4 -type d | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "NO_APP_BUNDLE"; exit 1; fi
          EXE="$APP/CubeAssistant"
          if [ ! -x "$EXE" ]; then echo "NO_EXECUTABLE"; exit 1; fi
          echo "exe type: $(file "$EXE")"
          if [ -f "$APP/Assets.car" ]; then echo "Assets.car present"; else echo "WARN no Assets.car"; fi
          echo "APP_OK"

      - name: Boot simulator + install + screenshots
        if: steps.verify.outcome == 'success'
        run: |
          set -e
          APP=$(find "$PWD/build" -name "CubeAssistant.app" -maxdepth 4 -type d | head -1)
          RUNTIME=$(xcrun simctl list runtimes -j | /usr/bin/python3 -c "import sys,json;r=json.load(sys.stdin)['runtimes'];ios=[x for x in r if 'iOS' in x['name']];print(ios[-1]['identifier'])")
          echo "RUNTIME=$RUNTIME"
          UDID=$(xcrun simctl create CubePrev "iPhone 17 Pro" "$RUNTIME")
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          sleep 3
          echo "=== install ==="
          xcrun simctl install "$UDID" "$APP"
          echo "install rc=$?"
          xcrun simctl listapps "$UDID" 2>/dev/null | grep -c "com.jiege.CubeAssistant" | sed 's/^/installed_count=/'
          mkdir -p /tmp/shots
          for mode in home scramble solve scan history; do
            xcrun simctl terminate "$UDID" com.jiege.CubeAssistant 2>/dev/null || true
            sleep 1
            if [ "$mode" = "home" ]; then
              xcrun simctl launch "$UDID" com.jiege.CubeAssistant >/tmp/launch_${mode}.log 2>&1
            else
              xcrun simctl launch "$UDID" com.jiege.CubeAssistant --preview "$mode" >/tmp/launch_${mode}.log 2>&1
            fi
            echo "launch rc=$? mode=$mode"
            sleep 6
            STATE=$(xcrun simctl get_app_state "$UDID" com.jiege.CubeAssistant 2>/dev/null | tail -1 || echo UNKNOWN)
            echo "state=$STATE mode=$mode"
            xcrun simctl io "$UDID" screenshot "/tmp/shots/prev_${mode}.png"
            echo "shot $mode -> $(wc -c < /tmp/shots/prev_${mode}.png) bytes"
          done
          {
            echo "=== RUNTIME ==="; echo "$RUNTIME"
            echo "=== APP ==="; echo "$APP"
            echo "=== launch logs ==="; cat /tmp/launch_*.log
            echo "=== app state (home) ==="; xcrun simctl get_app_state "$UDID" com.jiege.CubeAssistant 2>/dev/null
          } > /tmp/shots/_diag.txt 2>&1 || true
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID" || true

      - name: Commit previews back to preview branch (viewable without token)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/mengjiemy/CubeAssistant.git
          mkdir -p preview
          cp /tmp/shots/*.png preview/ 2>/dev/null || true
          cp /tmp/shots/_diag.txt preview/ 2>/dev/null || true
          git add preview/ || true
          git commit -m "chore: simulator previews [skip ci]" || echo "no changes to commit"
          git push origin HEAD:preview || echo "push preview failed"

      - name: Report failure to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(grep -iE "error:|BUILD FAILED|NO_APP_BUNDLE|NO_EXECUTABLE|install rc=|cannot be found|no such module" sim.log /tmp/shots/_diag.txt 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | head -60)
          [ -z "$RAW" ] && RAW="(no error keywords) see preview branch _diag.txt"
          gh issue create --title "Preview failed $(date +%s)" --body "$(printf '```\n%s\n```', "$RAW")"
