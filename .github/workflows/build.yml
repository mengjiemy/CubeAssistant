name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List targets/schemes
        run: xcodebuild -project CubeAssistant.xcodeproj -list

      - name: Build (no code signing)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project CubeAssistant.xcodeproj \
            -target CubeAssistant \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Report build error to issue
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(tail -120 build.log | sed 's/\x1b\[[0-9;]*m//g')
          gh issue create --title "CI build failed ($(date +%s))" --body "$(printf 'Build log tail:\n\n```\n%s\n```\n\nLog total bytes: %s' "$RAW" "$(wc -c < build.log)")"

      - name: Package unsigned IPA
        if: steps.build.outcome == 'success'
        run: |
          APP=$(find "$PWD/build/DerivedData/Build/Products" -name "CubeAssistant.app" -maxdepth 3 -type d | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "ERROR: app not found"; exit 1; fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -r CubeAssistant.ipa Payload

      - name: Upload IPA artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CubeAssistant-unsigned-ipa
          path: build/CubeAssistant.ipa
          retention-days: 30
