name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode 26
        uses: ruby/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Archive (no code signing)
        run: |
          xcodebuild archive \
            -target CubeAssistant \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/CubeAssistant.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/CubeAssistant.xcarchive/Products/Applications/CubeAssistant.app" build/Payload/
          cd build && zip -r CubeAssistant.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CubeAssistant-unsigned-ipa
          path: build/CubeAssistant.ipa
          retention-days: 30
