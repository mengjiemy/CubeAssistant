name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no code signing)
        run: |
          xcodebuild build \
            -project CubeAssistant.xcodeproj \
            -target CubeAssistant \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Locate .app and package unsigned IPA
        run: |
          APP=$(find "$PWD/build/DerivedData/Build/Products" -name "CubeAssistant.app" -maxdepth 3 -type d | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "ERROR: app not found"; exit 1; fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -r CubeAssistant.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CubeAssistant-unsigned-ipa
          path: build/CubeAssistant.ipa
          retention-days: 30
